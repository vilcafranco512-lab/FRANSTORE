<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franstore — Tienda Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <div class="header__contenedor">
        <div class="marca">
            <a href="#" class="marca__logo" aria-label="Franstore, inicio">
                <span class="marca__icono">F</span>
                <span class="marca__nombre">
                    franstore
                    <small class="marca__etiqueta">TIENDA</small>
                </span>
            </a>
        </div>

        <nav class="nav" aria-label="Navegación principal">
            <a href="#" class="nav__enlace nav__enlace--activo">Catálogo</a>
            <a href="#" class="nav__enlace">Ofertas</a>
            <a href="#" class="nav__enlace">Favoritos</a>
        </nav>

        <div class="acciones">
            <button type="button" class="acciones__ubicacion">
                <span aria-hidden="true">⌖</span>
                Envíos a La Paz
                <span aria-hidden="true">⌄</span>
            </button>

            <button type="button" class="acciones__carrito">
                <span aria-hidden="true">🛒</span>
                Carrito (0)
            </button>

            <button type="button" class="acciones__menu" aria-label="Abrir menú de navegación">
                ☰
            </button>
        </div>
    </div>
</header>

</body>
</html>
