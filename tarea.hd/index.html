<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franstore — Tienda Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
<header class="header">
    <div class="header-contenedor">
        <div class="marca">
            <a href="#" class="marca-logo" aria-label="Franstore, inicio">
                <span class="logo-icono">F</span>
                <span class="marca-nombre">
                    franstore
                    <small>TIENDA</small>
                </span>
            </a>
        </div>
        
        <nav class="navegacion" aria-label="Navegación principal">
            <a href="#" class="nav-enlace activo">Catálogo</a>
            <a href="#" class="nav-enlace">Ofertas</a>
            <a href="#" class="nav-enlace">Favoritos</a>
        </nav>
        
        <div class="header-acciones">
            <button type="button" class="ubicacion">
                <span aria-hidden="true">⌖</span>
                Envíos a La Paz
                <span aria-hidden="true">⌄</span>
            </button>

            <button type="button" class="btn-carrito">
                <span aria-hidden="true">🛒</span>
                Carrito (0)
            </button>

            <button type="button" class="btn-menu" aria-label="Abrir menú de navegación">
                ☰
            </button>
        </div>
    </div>
</header>

</body>
</html>
